const tileCache=new Map();
function rng(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function materialTile(type,color,seed){
 const key=[type,color,seed].join('/');if(tileCache.has(key))return tileCache.get(key);
 const c=document.createElement('canvas');c.width=300;c.height=220;const g=c.getContext('2d');const random=rng(seed);
 g.fillStyle=color;g.fillRect(0,0,300,220);
 for(let i=0;i<14000;i++){const white=random()>.5;g.fillStyle=white?'rgba(255,255,245,.09)':'rgba(35,24,13,.06)';g.fillRect(random()*300,random()*220,1.2,1)}
 if(type==='wood'){
 for(let k=0;k<240;k++){const yy=random()*227-3,amp=random()*5,offset=random()*3;g.beginPath();g.moveTo(-6,yy);for(let x=0;x<=310;x+=6)g.lineTo(x,yy+amp*Math.sin(x*.014+offset)+Math.sin((x+yy)*.025)*2.5);g.strokeStyle=k%3?'rgba(59,40,17,'+(.045+random()*.17)+')':'rgba(255,245,216,.28)';g.lineWidth=.25+random()*1.5;g.stroke()}
 }else if(type==='cloth'){
 for(let x=-2;x<302;x+=3){g.strokeStyle='rgba(255,251,232,.35)';g.beginPath();g.moveTo(x,0);g.lineTo(x+2,220);g.lineWidth=1;g.stroke();g.fillStyle='rgba(38,39,25,.21)';g.fillRect(x+1.7,0,.8,220)}
 for(let y=0;y<220;y+=3.5){g.fillStyle='rgba(252,248,231,.25)';g.fillRect(0,y,300,1.3);g.fillStyle='rgba(44,40,27,.18)';g.fillRect(0,y+1.9,300,.7)}
 }else if(type==='stone'){
 for(let i=0;i<1000;i++){let x=random()*300,y=random()*220,s=random()**3*4+.3;g.beginPath();g.fillStyle=i%3?'rgba(77,69,53,.2)':'rgba(255,252,232,.52)';g.moveTo(x,y);g.lineTo(x+s*1.5,y+.6);g.lineTo(x+s*.8,y+s);g.closePath();g.fill()}
 for(let a=0;a<7;a++){let y=random()*220;g.beginPath();g.moveTo(0,y);for(let x=0;x<=300;x+=8){y+=(random()-.43)*8;g.lineTo(x,y)}g.strokeStyle='rgba(127,115,95,.2)';g.lineWidth=random()+.3;g.stroke()}
 }
 tileCache.set(key,c);return c;
}
function makeBoard(canvas,index){
 const look=looks[index],g=canvas.getContext('2d');canvas.width=244;canvas.height=155;g.fillStyle=look.board;g.fillRect(0,0,244,155);
 function offcut(x,y,w,h,rotation,tile,round=false){g.save();g.translate(x,y);g.rotate(rotation);g.shadowColor='rgba(52,37,20,.48)';g.shadowBlur=7;g.shadowOffsetY=5;g.shadowOffsetX=3;g.beginPath();if(round)g.arc(0,0,w/2,0,Math.PI*2);else g.rect(-w/2,-h/2,w,h);g.fillStyle='#e6d9b8';g.fill();g.shadowColor='transparent';g.save();g.clip();g.drawImage(tile,-w/2,-h/2,w,h);g.restore();g.strokeStyle='rgba(255,255,240,.38)';g.lineWidth=1.5;g.stroke();g.restore()}
 offcut(65,83,150,163,-.31,materialTile('wood',look.colors[0],index+17));
 offcut(172,47,146,90,-.30,materialTile('cloth',look.colors[3],index+27));
 offcut(172,112,99,100,0,materialTile('stone',look.colors[1],index+57),true);
 const wash=g.createLinearGradient(20,0,210,155);wash.addColorStop(0,'rgba(255,250,230,.15)');wash.addColorStop(.65,'rgba(255,250,230,0)');wash.addColorStop(1,'rgba(60,46,28,.12)');g.fillStyle=wash;g.fillRect(0,0,244,155);
}

}

 $('#viewport').setAttribute('aria-hidden',String(!is3));$('#viewport').tabIndex=is3?0:-1;if(is3&&home)requestAnimationFrame(()=>home?.renderNow());$('#pins').hidden=!is3;$('#viewTools').hidden=false;for(const [id,t] of [['resetview',is3?'回到全屋鸟瞰':'重置平面'],['zoomout',is3?'拉远镜头':'缩小平面'],['zoomin',is3?'拉近镜头':'放大平面']]){const b=document.getElementById(id);b.title=t;b.setAttribute('aria-label',t)}$('#hotBtn').hidden=!is3;$('#cutBtn').hidden=!is3;
 for(const [sel,active] of [['#mode3d',is3],['#mode2d',!is3]]){const btn=$(sel);btn.classList.toggle('selected',active);btn.setAttribute('aria-pressed',String(active))}
 if(!is3){closeHot();readView(state.failed?'当前设备使用平面模式':'原始 CAD 平面','Original plan')}else{const v=cameras.find(v=>v.id===state.view)||cameras[0];readView(v.name,v.en);renderPins()}
 markActive(all('.cam'),el=>is3&&el.dataset.view===state.view&&!state.focus);
}
function selectView(id,instant=false){
 if(state.failed){setMode('2d');return}
 closeHot();state.view=id;setMode('3d');home?.setView(id,{instant});markActive(all('.cam'),el=>el.dataset.view===id);const v=cameras.find(v=>v.id===id);readView(v.name,v.en);renderPins();announce('镜头已转向'+v.name)
}
function focusPoint(id){const i=points.findIndex(p=>p.id===id);if(i<0)return;const p=points[i];if(state.failed){openPage('diagnosis');return}setMode('3d');state.focus=id;state.showPins=true;$('#hotBtn').setAttribute('aria-pressed','true');markActive(all('.cam'),()=>false);renderPins();home?.focus(id);
 const card=$('#hotcard');card.innerHTML='<header><span class="dindex">设计热点　'+String(i+1).padStart(2,'0')+' / 05</span><button class="icononly" aria-label="关闭热点说明">'+icon('x')+'</button></header><h3>'+p.title+'</h3><p>'+p.story+'</p><footer>'+p.metric+'</footer>';
 card.hidden=false;card.querySelector('button').onclick=()=>selectView('overview');readView(p.short,'Design detail');announce(p.title);
}
function closePage(){if($('#drawer').open)$('#drawer').close()}
function openPage(page){
 if(page==='tour'){closePage();return}
 const isD=page==='diagnosis';state.page=page;$('#drawerTitle').textContent=isD?'户型诊断与规划':'预算与落地清单';$('#drawerEyebrow').textContent=isD?'PLAN STUDY   /   户型解读':'COST PLAN   /   造价估算';
 $('#dbody').innerHTML=isD?diagnosisHTML():budgetHTML(state.tier);$('#dbody').scrollTop=0;markActive(all('.navitem'),el=>el.dataset.page===page);
 const box=$('#drawer');if(!box.open){lastButton=document.activeElement;box.showModal()}document.body.style.overflow='hidden';
}
function bindControls(){
 document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
 if(btn.hasAttribute('data-page'))openPage(btn.dataset.page);
 if(btn.hasAttribute('data-time'))updateTime(+btn.dataset.time);
 if(btn.hasAttribute('data-tier')){state.tier=+btn.dataset.tier;$('#dbody').innerHTML=budgetHTML(state.tier);$('#dbody [data-tier="'+state.tier+'"]').focus({preventScroll:true})}
 if(btn.hasAttribute('data-plan')){closePage();setMode('2d');$('#stage').scrollIntoView({block:'nearest'})}
 if(btn.hasAttribute('data-focus')){closePage();focusPoint(btn.dataset.focus);$('#stage').scrollIntoView({block:'nearest'})}
 });
 $('#drawer').addEventListener('close',()=>{state.page='tour';document.body.style.overflow='';markActive(all('.navitem'),el=>el.dataset.page==='tour');lastButton?.focus?.({preventScroll:true})});
 $('#drawer').addEventListener('click',e=>{if(e.target!==$('#drawer'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePage()});
 $('#closeDrawer').onclick=closePage;$('#mode3d').onclick=()=>setMode('3d');$('#mode2d').onclick=()=>setMode('2d');$('#resetview').onclick=()=>state.mode==='2d'?resetPlan():selectView('overview');
 $('#zoomout').onclick=()=>state.mode==='2d'?zoomPlan(1.22):home?.zoom(1.15);$('#zoomin').onclick=()=>state.mode==='2d'?zoomPlan(.82):home?.zoom(.87);
 $('#hotBtn').onclick=()=>{if(state.focus){selectView('overview');state.showPins=true}else if(state.view!=='overview'){selectView('overview');state.showPins=true}else state.showPins=!state.showPins;$('#hotBtn').setAttribute('aria-pressed',String(state.showPins));renderPins()};
 $('#cutBtn').onclick=()=>{const modes=['auto','full','low'];state.cut=modes[(modes.indexOf(state.cut)+1)%3];home?.setCut(state.cut);$('#cutBtn span').textContent=({auto:'自动剖切',full:'全高墙体',low:'低墙剖切'})[state.cut]};
 $('#hideRail').onclick=()=>{$('#desk').classList.add('compact');$('#showRail').hidden=false;$('#showRail').focus({preventScroll:true})};
 $('#showRail').onclick=()=>{$('#desk').classList.remove('compact');$('#showRail').hidden=true;if(matchMedia('(max-width:850px)').matches)$('#rail').scrollIntoView({block:'start',behavior:'smooth'});$('#hideRail').focus({preventScroll:true})};
 $('#timeRange').oninput=e=>updateTime(+e.target.value);
 const full=$('#fullscreen');if(!document.fullscreenEnabled)full.hidden=true;
 full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{announce('当前浏览器未允许全屏演示')}};
 document.addEventListener('fullscreenchange',()=>{full.querySelector('span').textContent=document.fullscreenElement?'退出全屏':'全屏演示'});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.focus&&!$('#drawer').open)selectView('overview')});
}
function noWebGL(){
 state.failed=true;$('#loading').hidden=true;$('#mode3d').disabled=true;$('#mode3d').title='当前设备未提供 WebGL';all('.daychoices button,.stylebtn,.cam,#timeRange').forEach(el=>el.disabled=true);setMode('2d');
}
function startHome(){try{
 if(typeof createHomeScene!=='function'){noWebGL();return}
 const views=Object.fromEntries(cameras.filter(v=>v.position).map(v=>[v.id,v]));
 home=createHomeScene($('#viewport'),{views,hotspots:points,onFrame:renderPins});
 window.home=home;$('#loading').hidden=true;setMode('3d');renderPins();
 }catch(err){console.error('住宅三维显示未启动',err);noWebGL()}}
icons();rebuildLists();bindControls();updateStyle(0,false);updateTime(0,false);markActive(all('.cam'),el=>el.dataset.view==='overview');
requestAnimationFrame(()=>requestAnimationFrame(startHome));</script><!-- Three.js and bundled addons
